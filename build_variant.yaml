#config
# Here is the list of templates that will be used for creating their copies without .temp suffix.
_files:
  - pubspec.yaml.yaml
  #  - lib/di/di.dart.temp
  - android/app/src/main/res/values/.build_res.xml.temp
  - android/build_variable.properties.temp
  - android/app/src/main/AndroidManifest.xml.temp
  - ios/BuildVariable.xcconfig.temp
  - ios/Runner/Info.plist.temp
  - lib/inject/modules/crypto_module.dart.temp
  - ios/Runner/Runner.entitlements.temp
  - ios/AppShareExtension/AppShareExtension.entitlements.temp
  - ios/ExportOptions.plist.temp

# List of files that will be copied. The Key is a source path, Value is a destination path.
_copy:
  '{{main_logo}}': 'android/app/src/main/res/drawable/main_logo.png'
  '{{_google_services}}': 'android/app/google-services.json'
  '{{_google_services_ios}}': 'ios/Runner/GoogleService-Info.plist'
  '{{_sign_dir}}/key.properties': 'android/key.properties'
  '{{_sign_dir}}/key.jks': 'android/app/key.jks'

# variables that are used in templates and are added to paths _buildPropertyPath
_buildPropertyPath: lib/build_property.dart
#default config
_buildVariant: 'build_res/afterlogic/build_variant.yaml'
#variables
appName: ''
_iosAppName: '{{appName}}'
_appId: ''
_iosAppId: '{{_appId}}'
_appleGroupId: ''
packageName: '{{_appId}}'
version: ''
build: 403

icon: '{{image_dir}}/icon.png'
main_logo: '{{image_dir}}/main_logo.png'
image_dir: '{{_dir}}/image'

_sign_dir: '{{_dir}}/sign'
_google_services_dir: '{{_dir}}/crashlytics'
_google_services: '{{_google_services_dir}}/google-services.json'
_google_services_ios: '{{_google_services_dir}}/GoogleService-Info.plist'

autodiscover_url: ''

deepLink: '{{packageName}}'

foreground_icon: '{{image_dir}}/icon_foreground.png'
background_color: '#FFFFFF'
_theme_module: '{{_dir}}/theme'

privacyPolicy: ''
termsOfService: ''
# enum from package:aurora_mail/modules/settings/models/sync_period.dart
syncPeriod: 'Period.allTime'
supportLanguage: 'ru,en,tr'
hasFloatingPlaceholder: 'never' # auto or never

multiUserEnable: false
cryptoEnable: false
multiAccountEnable: false
useMainLogo: false
selfDestructingEmail: false
expandMessageThread: false
legacyPgpKey: false
logger: true
pushNotification: true
backgroundSync: false
supportAllowAccess: true

# fido
useYubiKit: false
yubico_flutter_lib: 'path: module/mocks/yubico_flutter'
#useYubiKit: true
#yubico_flutter_lib: "git: https://github.com/afterlogic/yubico_flutter"

#Custom floating action button
#true and false values are inverted
disableShadowFloatingActionButton: false # disable shadow for floating action button
disableScreenShadowFloatingActionButton: false # disable shadow for floating action button on screen

#Custom Drawer
useDrawerGradient: true # use gradient for drawer
useCustomDrawerIcons: true # use custom drawer folder icons
useCustomDrawerIconColors: true # use custom colors for drawer icons

#Custom contacts
useContactsRoundIcons: true # use round contact icons
useContactsDivider: true # use dividers between contacts
useCustomContactIcons: true # use custom SVG icons for contact details
useCustomAppBarTextColor: true # use custom color for AppBar title text
useMailDivider: false
useCustomStarIcons: false

#Custom input styles
useCustomInputStyles: true # use custom input styles

#Custom bottom bar
useCustomBottomBarIcons: true # use custom bottom bar icons
showBottomBarLabels: true # show bottom bar labels
useCustomBottomBarColors: true # use custom bottom bar colors (only for dark theme)

#Custom settings
useCustomSettingsIcons: true # use custom settings menu icons
useSettingsMenuDivider: true # use dividers between settings menu items
useSettingsMenuTrailingArrow: true # use trailing arrows in settings menu
useCustomSettingsColors: true # use custom colors for settings menu items

#AppBar customization
useAppBarDivider: true # add divider line under AppBar
useCustomAppBarIcons: true # use custom SVG icons in AppBar (burger, search, back/close)

#Theme selection
showThemeSelection: false # show theme selection in settings

#Action button icons
usePlusIconForActionButtons: true # use plus icon for floating action buttons
