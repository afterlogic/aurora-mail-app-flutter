#Variables
appName: ''
version: 1.0.0

#Android App ID
_appId: ''
#iOS Team ID
_iosDeveloperId: ''
#iOS App Group ID
_appleGroupId: ''

#Android splash screen
background_color: '#FFFFFF'
useBackgroundImage: false
splashGradientTop: '#FFFFFF'
splashGradientBottom: '#FFFFFF'
splashGradientTopDark: '#000000'
splashGradientBottomDark: '#000000'

autodiscover_url: 'https://{domain}/aurora-autodiscover.json?email={email}'
privacyPolicy: ''
termsOfService: ''
registrationLink: ''

supportLanguage: 'en,tr,ru'

#App settings
syncPeriod: 'Period.months6'
mailMessagesChunkSize: 50

#App features list
backgroundSync: true
cryptoEnable: false
expandMessageThread: false
calendarModule: false
enableDebugScreen: false
notesModule: false
multiAccountEnable: false
multiUserEnable: false
enablePushNotification: false
showPushNotificatonsSettings: true
selfDestructingEmail: false
useMainLogo: false
supportAllowAccess: false

#FIDO Security key settings
#useYubiKit: false
#yubico_flutter_lib: "path: module/mocks/yubico_flutter"
#useYubiKit: true
#yubico_flutter_lib: "git: https://github.com/afterlogic/yubico_flutter"

useDrawerGradient: false # true for gradient drawer, false for white drawer
useCustomInputStyles: false # true for custom input styles, false for default styles
useCustomBottomBarIcons: false # true for custom PNG icons, false for MDI icons
showBottomBarLabels: false # true to show text labels under icons, false for icons only
useCustomBottomBarColors: false # true for custom icon colors, false for theme colors
