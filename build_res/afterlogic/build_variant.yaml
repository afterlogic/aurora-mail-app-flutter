#Variables
appName: 'Aurora Mail'
version: 2.4.0

#Android App ID
_appId: 'com.afterlogic.aurora.mail'
#iOS Team ID
_iosDeveloperId: 'J7AW6VHJK4'
#iOS App Group ID
_appleGroupId: 'group.com.afterlogic.aurora'

#Android splash screen
background_color: '#FFFFFF'
useBackgroundImage: false
splashGradientTop: '#FFFFFF'
splashGradientBottom: '#FFFFFF'
splashGradientTopDark: '#000000'
splashGradientBottomDark: '#000000'

autodiscover_url: 'https://{domain}/aurora-autodiscover.json?email={email}'
privacyPolicy: 'https://afterlogic.com/privacy-policy'
termsOfService: ''
registrationLink: ''

supportLanguage: 'en'

#App settings
syncPeriod: 'Period.months6'
mailMessagesChunkSize: 50

#App features list
backgroundSync: true
cryptoEnable: true
expandMessageThread: false
calendarModule: true
enableDebugScreen: true
notesModule: true
multiAccountEnable: true
multiUserEnable: false
enablePushNotification: false
showPushNotificatonsSettings: false
selfDestructingEmail: false
useMainLogo: false
supportAllowAccess: true

#FIDO Security key settings
#useYubiKit: true
#yubico_flutter_lib: "git: https://github.com/afterlogic/yubico_flutter"

#Custom Drawer
useDrawerGradient: false # use gradient for drawer
useCustomDrawerIcons: false # use custom drawer folder icons

#Custom input styles
useCustomInputStyles: false # use custom input styles

#Custom bottom bar
useCustomBottomBarIcons: false # use custom bottom bar icons
showBottomBarLabels: false # show bottom bar labels
useCustomBottomBarColors: false # use custom bottom bar colors (only for dark theme)

#Custom settings
useCustomSettingsIcons: false # use custom settings menu icons
useSettingsMenuDivider: false # use dividers between settings menu items
useSettingsMenuTrailingArrow: false # use trailing arrows in settings menu
useCustomSettingsColors: false # use custom colors for settings menu

#AppBar customization
useAppBarDivider: false # add divider line under AppBar
