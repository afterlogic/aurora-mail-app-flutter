name: aurora_mail
description: Mail client for {{appName}}.

version: "{{version}}+{{build}}"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.5+2

  # state management
  provider: ^5.0.0
  flutter_bloc: ^7.0.0
  bloc_concurrency: ^0.1.0
  equatable: ^2.0.5
  rxdart: ^0.27.7

  # http
  http: ^1.6.0
  webmail_api_client:
    path: ./core/webmail_api_client
  html: ^0.15.0

  # local storage
  drift_sqflite: ^2.0.1
  sqflite: ^2.4.2
  shared_preferences: ^2.5.5

  # file downloading/uploading
  file_picker: ^11.0.2
  background_downloader: ^8.7.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  video_thumbnail: 0.5.3
  mime: ^2.0.0
  # type ahead

  # ui
  flutter_svg: ^1.1.6
  flutter_material_design_icons: ^3.1.0+7447
  webview_flutter: ^4.14.1
  flutter_speed_dial: ^7.0.0
  fluttertoast: ^9.1.0
  shimmer: ^3.0.0
  table_calendar: ^3.0.8

  # i18n
#  localizator_interface: 0.4.0
  # misc
  uuid: ^4.1.0
  intl: 0.20.2
  filesize: ^2.0.1
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.0
  package_info_plus: ^9.0.1
  time_machine: ^0.9.17
  device_info_plus: ^11.3.0
  app_links: ^7.2.1
  flutter_custom_tabs: ^2.5.0

  # file encryption
  encrypt: ^5.0.1

  #background
  #  android_alarm_manager: 0.4.5+1 not working
  alarm_service:
    path: alarm_service

  notifications_utils:
    path: core/notifications_utils

  aurora_ui_kit:
    git:
      url: https://github.com/afterlogic/aurora_ui_kit_flutter.git
      ref: flutter_3.44

  receive_sharing:
    git:
      url: https://github.com/afterlogic/receive_sharing.git
      ref: flutter_3.44

  #notification
  flutter_local_notifications: ^19.4.2
  ios_notification_handler:
    path: core/ios_notification_handler
  keyboard_actions: ^4.2.1
  flutter_keyboard_visibility: ^6.0.0

  theme:
    path: {{_theme_module}}

  crypto_model:
    path: module/crypto/crypto_model
  crypto_storage:
    path: module/crypto/crypto_storage
  crypto_worker:
    path: module/crypto/crypto_worker
  flutter_secure_storage: ^10.3.1
  # if: cryptoEnable
  crypto_stream:
    git:
      url: https://github.com/afterlogic/flutter_crypto_stream
      ref: flutter_3.44
  crypto_storage_impl:
    path: module/crypto/crypto_storage_impl
  crypto_worker_impl:
    path: module/crypto/crypto_worker_impl
  # end: if

  dm: ^0.4.0

  # fido
  yubico_flutter:
    {{yubico_flutter_lib}}
  # logger
  aurora_logger:
    git:
      url: https://github.com/afterlogic/aurora_logger_flutter
      ref: flutter_3.44
  calendar_view:
    git:
      url: https://github.com/HtonicSava/flutter_calendar_view.git
      ref: all_day_section
  collection: ^1.17.0
  linkwell: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
#  dm_gen should be commented for moor_generator/drift_dev work
#  dm_gen: ^0.5.1+1
  build_runner: 2.15.1
  drift_dev: ^2.34.4
  build_variant:
    git:
      url: "https://github.com/afterlogic/build_variant"
      ref: flutter_3.44

  flutter_launcher_icons: ^0.14.4
  intl_utils: ^2.8.16
#  localizator: ^0.4.2

#dependency_overrides:
#  analyzer: 5.2.0
#  build: 2.1.0
#  meta: ^1.7.0
#  dart_style: 2.2.0
#  moor: 4.4.0

flutter_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: {{icon}}
  adaptive_icon_background: "{{background_color}}"
  adaptive_icon_foreground: {{foreground_icon}}

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - {{icon}}
    - {{main_logo}}
    - {{image_dir}}/
    - {{image_dir}}/bottom-app-bar/
    - {{image_dir}}/settings/
    - {{image_dir}}/settings/menu/
    - {{image_dir}}/settings/common/
    - {{image_dir}}/settings/sync/
    - {{image_dir}}/drawer/
    - {{image_dir}}/drawer/mail/
    - {{image_dir}}/drawer/contacts/
    - {{image_dir}}/drawer/calendar/
    - {{image_dir}}/mail/
    - {{image_dir}}/contacts/
    - {{image_dir}}/calendar/
    - {{image_dir}}/m-app-bar/

  fonts:
    - family: WebMailIcons
      fonts:
        - asset: assets/fonts/WebMailIcons.ttf