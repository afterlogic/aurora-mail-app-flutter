ext.kotlin_version = '2.3.20'

allprojects {
    repositories {
        google()
        jcenter()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Set kotlin version for subprojects
    beforeEvaluate { project ->
        if (project.name in ["ios_notification_handler", "notifications_utils"]) {
            project.buildscript.dependencies.classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
        }
    }

    // Workaround for old plugins (e.g. connectivity) that don't declare a
    // namespace, which AGP 8+ requires. Derives it from the manifest package.
    beforeEvaluate { project ->
        project.plugins.withId("com.android.library") {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def matcher = (manifestFile.text =~ /package="([^"]+)"/)
                    if (matcher.find()) {
                        androidExt.namespace = matcher.group(1)
                    }
                }
            }
        }
    }


    afterEvaluate { project ->
        // Enable buildConfig feature in subprojects
        if (project.hasProperty('android')) {
            project.android {
                buildFeatures {
                    buildConfig = true
                }
                // Keep Java compileOptions in sync with the Kotlin jvmTarget below,
                // otherwise Gradle fails with "Inconsistent JVM-target compatibility".
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        // Some plugins (e.g. flutter_keyboard_visibility) still declare an old
        // compileSdkVersion in their own build.gradle and haven't published a
        // newer release. Their transitive androidx dependencies now require a
        // higher compileSdk than that, so force every library subproject to
        // compile against the same SDK level as the app.
        project.plugins.withId("com.android.library") {
            project.android.compileSdkVersion = 36
        }
        // Set kotlin jvm target compatibility for subprojects
        project.plugins.withId("kotlin-android") {
            project.android {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
