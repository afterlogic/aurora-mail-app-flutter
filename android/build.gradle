buildscript {
    ext.kotlin_version = '1.8.0'
    repositories {
        google()
        jcenter()
        maven {
            url 'https://maven.fabric.io/public'
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Add the google services classpath
        classpath 'com.google.gms:google-services:4.3.8'
        // Add fabric classpath
        classpath 'io.fabric.tools:gradle:1.28.0'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Set kotlin version for subprojects
    beforeEvaluate { project ->
        if (project.name in ["ios_notification_handler", "notifications_utils"]) {
            project.buildscript.dependencies.classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
        }
    }

    // Workaround for old plugins (e.g. connectivity) that don't declare a
    // namespace, which AGP 8+ requires. Derives it from the manifest package.
    beforeEvaluate { project ->
        project.plugins.withId("com.android.library") {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def matcher = (manifestFile.text =~ /package="([^"]+)"/)
                    if (matcher.find()) {
                        androidExt.namespace = matcher.group(1)
                    }
                }
            }
        }
    }

    afterEvaluate { project ->
        // Enable buildConfig feature in subprojects
        if (project.hasProperty('android')) {
            project.android {
                buildFeatures {
                    buildConfig = true
                }
            }
        }
        // Set kotlin jvm target compatibility for subprojects
        project.plugins.withId("kotlin-android") {
            project.android {
                kotlinOptions {
                    jvmTarget = "1.8"
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
